<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkBuddy 工作台 · 精致版原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ Design Tokens (OKLCH · 暖色活力精致版) ============ */
:root{
  --brand-50:oklch(97% .02 55); --brand-100:oklch(94% .04 55); --brand-200:oklch(88% .08 55);
  --brand-300:oklch(80% .12 55); --brand-400:oklch(75% .14 55); --brand-500:oklch(70% .16 55);
  --brand-600:oklch(62% .17 55); --brand-700:oklch(52% .15 55); --brand-800:oklch(42% .12 55); --brand-900:oklch(32% .08 55);
  --accent-gold:oklch(82% .13 85);
  --accent-coral:oklch(65% .18 28);
  --neutral-0:oklch(99% .005 60); --neutral-50:oklch(97% .008 60); --neutral-100:oklch(95% .010 60);
  --neutral-200:oklch(90% .012 60); --neutral-300:oklch(86% .012 60); --neutral-400:oklch(72% .012 60);
  --neutral-500:oklch(58% .012 60); --neutral-600:oklch(48% .013 60); --neutral-700:oklch(38% .013 60); --neutral-900:oklch(26% .015 60);
  --success:oklch(60% .14 150); --warning:oklch(72% .15 80); --error:oklch(58% .18 28); --info:oklch(60% .11 240);

  --color-primary:var(--brand-500); --color-on-primary:var(--neutral-0);
  --color-text:var(--neutral-700); --color-text-strong:var(--neutral-900); --color-text-muted:var(--neutral-500);
  --color-surface:var(--neutral-0); --color-bg:linear-gradient(135deg,oklch(97% .012 60) 0%,oklch(94% .020 55) 100%);
  --color-border:var(--neutral-300); --color-divider:var(--neutral-200); --color-hover:var(--neutral-100);
  --surface-1:var(--neutral-0); --surface-2:oklch(98% .006 60); --overlay:oklch(26% .015 60 / .45);

  --font-display:'Plus Jakarta Sans','Noto Sans SC',system-ui,sans-serif;
  --font-body:var(--font-display);
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --text-xs:.75rem; --text-sm:.875rem; --text-base:1rem; --text-lg:1.25rem; --text-xl:1.5rem; --text-2xl:2rem;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px; --radius-pill:999px;
  --shadow-sm:0 1px 2px oklch(26% .015 60 / .06);
  --shadow-md:0 6px 20px oklch(70% .16 55 / .12);
  --shadow-lg:0 18px 50px oklch(26% .015 60 / .18);
  --ring-focus:0 0 0 3px oklch(70% .16 55 / .35);

  --ease-out-quart:cubic-bezier(.25,1,.5,1);
  --ease-out-expo:cubic-bezier(.16,1,.3,1);
  --dur-fast:150ms; --dur-base:220ms; --dur-slow:360ms;
}
:root[data-theme="dark"]{
  --color-bg:linear-gradient(135deg,oklch(18% .012 55) 0%,oklch(15% .010 55) 100%);
  --surface-1:oklch(20% .012 55); --surface-2:oklch(24% .012 55);
  --neutral-0:oklch(20% .012 55); --neutral-100:oklch(24% .012 55); --neutral-200:oklch(30% .012 55);
  --neutral-300:oklch(36% .012 55); --neutral-500:oklch(68% .012 55); --neutral-700:oklch(82% .010 55); --neutral-900:oklch(94% .008 55);
  --brand-500:oklch(72% .14 55); --brand-600:oklch(78% .12 55);
  --color-surface:var(--surface-1); --color-hover:var(--neutral-100);
  --shadow-sm:none; --shadow-md:0 0 0 1px oklch(0% 0 0 / .2);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:16px;}
body{font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);min-height:100vh;padding-bottom:56px;-webkit-font-smoothing:antialiased;font-kerning:normal;}
.nums{font-variant-numeric:tabular-nums;}

/* ============ Header ============ */
.app-header{background:linear-gradient(120deg,oklch(72% .16 55),oklch(66% .18 32));color:var(--neutral-0);
  padding:var(--space-5) var(--space-8);display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:var(--space-4);box-shadow:0 4px 16px oklch(66% .18 32 / .22);}
.brand{display:flex;flex-direction:column;line-height:1.15;}
.brand .name{font-family:var(--font-display);font-weight:var(--weight-bold);font-size:var(--text-xl);letter-spacing:-.01em;}
.brand .tag{font-size:var(--text-xs);font-weight:var(--weight-regular);opacity:.88;letter-spacing:.04em;margin-top:2px;}
.header-actions{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;}
.status-pill{display:inline-flex;align-items:center;gap:8px;background:oklch(0% 0 0 / .16);color:#fff;
  padding:7px 14px;border-radius:var(--radius-pill);font-size:var(--text-sm);font-weight:var(--weight-medium);}
.status-pill .live{width:8px;height:8px;border-radius:50%;background:oklch(85% .16 140);box-shadow:0 0 0 3px oklch(85% .16 140 / .3);}

/* ============ Workbench ============ */
.workbench{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-6);padding:var(--space-6) var(--space-8);align-items:start;max-width:1480px;margin:0 auto;}
@media(max-width:1100px){.workbench{grid-template-columns:repeat(2,1fr);}.panel-files{grid-column:1 / -1;}}
@media(max-width:760px){.workbench{grid-template-columns:1fr;padding:var(--space-4);}}

.panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);
  padding:var(--space-5);box-shadow:var(--shadow-sm);}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:var(--space-4);}
.panel-head .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.panel-apps .dot{background:var(--accent-gold);}
.panel-folders .dot{background:var(--brand-500);}
.panel-files .dot{background:var(--accent-coral);}
.panel-head h2{font-size:var(--text-lg);font-weight:var(--weight-semibold);color:var(--color-text-strong);letter-spacing:-.01em;}
.panel-head .count{margin-left:auto;font-size:var(--text-sm);color:var(--color-text-muted);font-variant-numeric:tabular-nums;}
.section-title{font-size:var(--text-xs);color:var(--color-text-muted);font-weight:var(--weight-semibold);
  letter-spacing:.08em;text-transform:uppercase;margin:var(--space-5) 0 var(--space-2);}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--radius-md);
  font-family:inherit;font-weight:var(--weight-semibold);cursor:pointer;transition:background var(--dur-fast),transform var(--dur-base) var(--ease-out-quart),box-shadow var(--dur-base),color var(--dur-fast);user-select:none;}
.btn:focus-visible{outline:none;box-shadow:var(--ring-focus);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.55;cursor:not-allowed;pointer-events:none;}
.btn-md{padding:9px 16px;font-size:var(--text-sm);}
.btn-sm{padding:6px 12px;font-size:.78rem;min-height:32px;}
.btn-primary{background:var(--brand-600);color:var(--neutral-0);}
.btn-primary:hover{background:var(--brand-700);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.btn-accent{background:var(--brand-600);color:var(--neutral-0);}
.btn-accent:hover{background:var(--brand-700);}
.btn-ghost{background:oklch(0% 0 0 / .12);color:#fff;}
.btn-ghost:hover{background:oklch(0% 0 0 / .22);}
.btn-subtle{background:transparent;color:var(--brand-700);border:1px solid var(--brand-200);}
.btn-subtle:hover{background:var(--brand-50);}
.btn-danger{background:var(--accent-coral);color:#fff;}
.btn-danger:hover{background:oklch(56% .17 28);}
.btn-popup{background:var(--neutral-900);color:var(--neutral-0);}
.btn-popup:hover{background:oklch(20% .012 60);}
.btn-edit{background:var(--accent-gold);color:oklch(34% .06 85);}
.btn-edit:hover{background:oklch(76% .13 85);}

/* ============ Toolbar / Search ============ */
.toolbar{display:flex;gap:var(--space-2);margin:var(--space-3) 0 var(--space-4);flex-wrap:wrap;align-items:center;}
.search{position:relative;flex:1;}
.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--color-border);border-radius:var(--radius-md);
  background:var(--neutral-50);color:var(--color-text);font-family:inherit;font-size:var(--text-sm);outline:none;
  transition:border-color var(--dur-fast),box-shadow var(--dur-fast);}
.search input::placeholder{color:var(--neutral-500);}
.search input:focus{border-color:var(--brand-500);box-shadow:var(--ring-focus);}
.search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--neutral-400);pointer-events:none;font-size:.95rem;}

/* ============ List rows (flat, hairline) ============ */
.list{display:flex;flex-direction:column;}
.row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);
  cursor:pointer;position:relative;transition:background var(--dur-fast),transform var(--dur-base) var(--ease-out-quart);}
.list.flush .row + .row{border-top:1px solid var(--color-divider);}
.row:hover{background:var(--color-hover);}
.row:hover .acts{opacity:1;transform:translateX(0);}
.chip{width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;flex-shrink:0;font-weight:var(--weight-bold);}
.chip-app{background:oklch(90% .06 85);color:oklch(40% .10 85);}
.chip-folder{background:oklch(90% .08 55);color:var(--brand-700);}
.chip-file{background:oklch(88% .08 28);color:var(--accent-coral);}
.chip-recent{background:var(--neutral-100);color:var(--color-text-muted);}
.info{flex:1;min-width:0;}
.name{font-size:var(--text-base);font-weight:var(--weight-semibold);color:var(--color-text-strong);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}
.path{font-family:var(--font-mono);font-size:var(--text-sm);color:var(--color-text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.acts{display:flex;gap:6px;flex-shrink:0;opacity:0;transform:translateX(6px);transition:opacity var(--dur-base),transform var(--dur-base) var(--ease-out-quart);}
@media(max-width:760px){.acts{opacity:1;transform:none;}}

/* ============ Tabs ============ */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--space-4);}
.tab{padding:7px 14px;border-radius:var(--radius-pill);background:var(--neutral-100);border:1px solid var(--color-divider);
  font-size:var(--text-sm);color:var(--color-text);cursor:pointer;transition:background var(--dur-base),color var(--dur-base),border-color var(--dur-base);}
.tab:hover{background:var(--color-hover);}
.tab.active{background:var(--brand-500);color:#fff;border-color:var(--brand-500);}
.tab:focus-visible{outline:none;box-shadow:var(--ring-focus);}

.file-frame{width:100%;height:min(56vh,520px);border:1px solid var(--color-divider);border-radius:var(--radius-md);background:#fff;}
.file-bar{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-3);justify-content:flex-end;}

/* ============ Modal ============ */
.modal-overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;z-index:100;padding:var(--space-4);}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface-2);border-radius:var(--radius-xl);padding:var(--space-6);width:420px;max-width:100%;
  box-shadow:var(--shadow-lg);animation:modalIn var(--dur-slow) var(--ease-out-expo);}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal h3{font-size:var(--text-lg);font-weight:var(--weight-semibold);color:var(--color-text-strong);margin-bottom:var(--space-4);}
.field{margin-bottom:var(--space-4);}
.field label{display:block;font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:6px;font-weight:var(--weight-medium);}
.field input{width:100%;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md);
  background:var(--neutral-50);color:var(--color-text);font-family:inherit;font-size:var(--text-sm);outline:none;transition:border-color var(--dur-fast),box-shadow var(--dur-fast);}
.field input:focus{border-color:var(--brand-500);box-shadow:var(--ring-focus);}
.modal-acts{display:flex;gap:var(--space-2);justify-content:flex-end;margin-top:var(--space-5);}

/* ============ Toast / Status / Empty ============ */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--neutral-900);
  color:var(--neutral-0);padding:10px 20px;border-radius:var(--radius-pill);font-size:var(--text-sm);font-weight:var(--weight-medium);
  opacity:0;pointer-events:none;transition:opacity var(--dur-base),transform var(--dur-base) var(--ease-out-quart);z-index:120;box-shadow:var(--shadow-lg);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.status-bar{position:fixed;bottom:0;left:0;right:0;background:oklch(99% .005 60 / .85);backdrop-filter:blur(8px);
  border-top:1px solid var(--color-divider);padding:8px var(--space-8);font-size:var(--text-sm);color:var(--color-text-muted);
  display:flex;gap:var(--space-6);z-index:40;align-items:center;}
:root[data-theme="dark"] .status-bar{background:oklch(20% .012 55 / .85);}
.status-bar .nums{color:var(--color-text);}
.empty{padding:var(--space-6) var(--space-2);text-align:center;color:var(--color-text-muted);font-size:var(--text-sm);}
.empty .ico{font-size:1.6rem;display:block;margin-bottom:var(--space-2);opacity:.6;}
.badge{display:inline-flex;align-items:center;font-size:var(--text-xs);font-weight:var(--weight-semibold);
  padding:2px 8px;border-radius:var(--radius-pill);}
.badge-url{background:oklch(90% .08 28 / .5);color:var(--accent-coral);}
.badge-local{background:oklch(90% .06 85 / .5);color:oklch(40% .10 85);}

/* theme toggle */
.theme-toggle{position:fixed;top:18px;right:var(--space-8);z-index:50;}
@media(max-width:760px){.theme-toggle{right:var(--space-4);}}

@media(prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;}
  .row:hover{transform:none;}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="name">WorkBuddy 工作台</span>
    <span class="tag">暖色活力 · 精致版 · 三栏本地工作台</span>
  </div>
  <div class="header-actions">
    <span class="status-pill"><span class="live"></span><span id="pillStat" class="nums">应用 3 · 文件夹 4 · 文件 2</span></span>
    <button class="btn btn-primary btn-md" onclick="launchAll()">全部启动</button>
    <button class="btn btn-ghost btn-md" onclick="closeAll()">全部关闭</button>
  </div>
</header>

<button class="btn btn-subtle btn-sm theme-toggle" onclick="toggleTheme()" title="切换明暗主题">◐ 明暗</button>

<main class="workbench">

  <!-- 栏1 常用应用 -->
  <section class="panel panel-apps">
    <div class="panel-head"><span class="dot"></span><h2>常用应用</h2><span class="count nums" id="appCount">3</span></div>
    <div class="search" role="search">
      <span class="si">⌕</span>
      <input id="appSearch" type="search" placeholder="搜索本机应用，如 微信 / chrome" oninput="onSearch(this.value)" aria-label="搜索本机应用">
    </div>
    <div class="toolbar"><button class="btn btn-subtle btn-sm" onclick="openAddApp()">＋ 添加应用</button></div>
    <div class="list flush" id="appsList"></div>
    <div class="list flush" id="searchResults" style="display:none"></div>
  </section>

  <!-- 栏2 常用文件夹 -->
  <section class="panel panel-folders">
    <div class="panel-head"><span class="dot"></span><h2>常用文件夹</h2><span class="count nums">4</span></div>
    <div class="section-title">固定文件夹</div>
    <div class="list flush" id="pinnedList"></div>
    <div class="section-title">最近访问</div>
    <div class="list flush" id="recentList"></div>
  </section>

  <!-- 栏3 常用文件 -->
  <section class="panel panel-files">
    <div class="panel-head"><span class="dot"></span><h2>常用文件</h2><span class="count nums">2</span></div>
    <div class="tabs" id="fileTabs" role="tablist"></div>
    <div id="fileContent" role="tabpanel"></div>
  </section>

</main>

<!-- Modal -->
<div class="modal-overlay" id="appModal" aria-modal="true">
  <div class="modal">
    <h3 id="modalTitle">添加应用</h3>
    <div class="field"><label for="appName">名称</label><input id="appName" placeholder="应用名称"></div>
    <div class="field"><label for="appPath">路径</label><input id="appPath" class="mono" placeholder="C:\Program Files\...\app.exe" style="font-family:var(--font-mono)"></div>
    <div class="modal-acts">
      <button class="btn btn-subtle btn-md" onclick="closeModal()">取消</button>
      <button class="btn btn-primary btn-md" onclick="saveApp()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="status-bar">
  <span id="statusText">就绪 · 端口 38760</span>
  <span class="nums">下次刷新 30 分钟后</span>
  <span style="margin-left:auto" class="nums">v2 精致版原型</span>
</div>

<script>
/* ---- 样例数据（与真实 config 对齐） ---- */
var apps=[
  {id:'a1',name:'workbuddy',path:'C:\\Users\\<用户名>\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\WorkBuddy.lnk'},
  {id:'a2',name:'ima',path:'C:\\Users\\<用户名>\\AppData\\Local\\ima.copilot\\Application\\ima.copilot.exe'},
  {id:'a3',name:'微信',path:'C:\\Program Files (x86)\\Tencent\\WeChat\\WeChat.exe'}
];
var pinned=[
  {id:'p1',name:'2026-08-11-17-16-49',path:'C:\\Users\\<用户名>\\WorkBuddy\\2026-08-11-17-16-49'},
  {id:'p2',name:'report',path:'C:\\Users\\<用户名>\\WorkBuddy\\2026-08-17-13-53-15\\report'}
];
var recent=[
  {name:'项目A',path:'C:\\Users\\<用户名>\\WorkBuddy\\项目A'},
  {name:'项目B',path:'C:\\Users\\<用户名>\\WorkBuddy\\项目B'}
];
var files=[
  {id:'f1',name:'示例在线表格',path:'https://docs.qq.com/sheet/<你的表格ID>',type:'url'},
  {id:'f2',name:'示例在线文档',path:'https://docs.qq.com/doc/<你的文档ID>',type:'url'}
];
var activeFile=0;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function $(id){return document.getElementById(id);}
function uid(){return 'x'+Date.now().toString(36);}

function renderApps(){
  var h='';
  if(!apps.length){h=empty('暂无应用','点击「＋ 添加应用」或搜索本机应用');}
  else{h=apps.map(function(a){
    return row({cls:'chip-app',icon:'💻',name:a.name,path:a.path,
      acts:'<button class="btn btn-accent btn-sm" onclick="event.stopPropagation();toast(\'打开：'+esc(a.name)+'\')">打开</button>'+
            '<button class="btn btn-edit btn-sm" onclick="event.stopPropagation();editApp(\''+a.id+'\')">编辑</button>'+
            '<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();delApp(\''+a.id+'\')">删除</button>'});
  }).join('');}
  $('appsList').innerHTML=h;
  $('appCount').textContent=apps.length;
  updatePill();
}
function row(o){
  return '<div class="row" onclick="'+(o.click||'')+'">'+
    '<div class="chip '+o.cls+'">'+o.icon+'</div>'+
    '<div class="info"><div class="name">'+esc(o.name)+'</div>'+
    (o.path?'<div class="path">'+esc(o.path)+'</div>':'')+'</div>'+
    '<div class="acts">'+(o.acts||'')+'</div></div>';
}
function empty(t,s){return '<div class="empty"><span class="ico">◌</span><div>'+esc(t)+'</div><div style="font-size:.78rem;margin-top:4px;opacity:.8">'+esc(s)+'</div></div>';}

function renderFolders(){
  $('pinnedList').innerHTML = pinned.length? pinned.map(function(f){
    return row({cls:'chip-folder',icon:'📁',name:f.name,path:f.path,
      acts:'<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();delPinned(\''+f.id+'\')">删除</button>',
      click:'toast(\'打开文件夹：'+esc(f.name)+'\')'});
  }).join('') : empty('暂无固定文件夹','把常用文件夹固定在此处');

  $('recentList').innerHTML = recent.length? recent.map(function(f){
    return row({cls:'chip-recent',icon:'🕘',name:f.name,path:f.path,click:'toast(\'打开文件夹：'+esc(f.name)+'\')'});
  }).join('') : '<div class="empty" style="padding:8px 0">暂无最近访问</div>';
  updatePill();
}

function renderFiles(){
  var tabs=files.map(function(f,i){
    return '<div class="tab'+(i===activeFile?' active':'')+'" role="tab" tabindex="0" onclick="openFile('+i+')" onkeydown="if(event.key==="Enter")openFile('+i+')">'+
      esc(f.name)+' <span class="badge '+(f.type==='url'?'badge-url':'badge-local')+'">'+(f.type==='url'?'在线':'本地')+'</span></div>';
  }).join('');
  $('fileTabs').innerHTML=tabs;
  openFile(activeFile);
}
function openFile(i){
  activeFile=i;
  var f=files[i];if(!f)return;
  document.querySelectorAll('#fileTabs .tab').forEach(function(t,idx){t.className='tab'+(idx===i?' active':'');});
  var c=$('fileContent');
  if(f.type==='url'){
    c.innerHTML='<iframe class="file-frame" src="'+esc(f.path)+'" title="'+esc(f.name)+'"></iframe>'+
      '<div class="file-bar"><button class="btn btn-popup btn-sm" onclick="popout(\''+esc(f.path)+'\',\''+esc(f.name)+'\')">⤢ 独立窗口</button></div>';
  }else{
    c.innerHTML=row({cls:'chip-file',icon:'📄',name:f.name,path:f.path,
      acts:'<button class="btn btn-accent btn-sm" onclick="event.stopPropagation();toast(\'打开：'+esc(f.name)+'\')">打开</button>',
      click:'toast(\'打开：'+esc(f.name)+'\')'});
  }
}
function popout(url,title){
  var w=window.open('','_blank','width=1200,height=800');
  if(!w){toast('请允许弹出窗口');return;}
  w.document.write('<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>'+title+'</title>'+
    '<style>body{margin:0;font-family:Segoe UI,system-ui,sans-serif}header{background:linear-gradient(120deg,oklch(72% .16 55),oklch(66% .18 32));color:#fff;padding:10px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}header button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}iframe{width:100%;height:calc(100vh - 44px);border:0}</style>'+
    '</head><body><header><span>'+title+' · 独立窗口</span><button onclick="window.close()">关闭</button></header>'+
    '<iframe src="'+url+'"></iframe></body></html>');
  w.document.close();
}

/* search (demo: filter local apps + simulate 1 indexed hit) */
function onSearch(q){
  q=q.trim();
  var box=$('searchResults'),list=$('appsList');
  if(!q){box.style.display='none';list.style.display='';return;}
  var ql=q.toLowerCase();
  var matched=apps.filter(function(a){return a.name.toLowerCase().indexOf(ql)>=0;});
  // 模拟"本机索引"额外命中
  var extra=[];
  if(/chrome/i.test(q)) extra.push({name:'Google Chrome',path:'C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe'});
  if(/千问|qwen/i.test(q)) extra.push({name:'通义千问',path:'C:\\Users\\<用户名>\\AppData\\Local\\Qwen\\Qwen.exe'});
  if(/微信|wechat/i.test(q)) extra.push({name:'WeChat',path:'C:\\Program Files (x86)\\Tencent\\WeChat\\WeChat.exe'});
  var all=matched.concat(extra.filter(function(e){return !apps.some(function(a){return a.path===e.path;});}));
  list.style.display='none';box.style.display='';
  if(!all.length){box.innerHTML=empty('未找到匹配应用','换个关键词，或点「＋ 添加应用」手动添加');return;}
  box.innerHTML=all.map(function(a){
    return row({cls:'chip-app',icon:'💻',name:a.name,path:a.path,
      acts:'<button class="btn btn-accent btn-sm" onclick="event.stopPropagation();toast(\'打开：'+esc(a.name)+'\')">打开</button>'+
            '<button class="btn btn-subtle btn-sm" onclick="event.stopPropagation();addFound(\''+esc(a.name).replace(/'/g,'')+'\',\''+esc(a.path).replace(/'/g,'')+'\')">添加</button>'});
  }).join('');
}
function addFound(name,path){
  name=decodeEntities(name);path=decodeEntities(path);
  if(apps.some(function(a){return a.path===path;})){toast('该应用已在列表中');return;}
  apps.push({id:uid(),name:name,path:path});
  renderApps();$('searchResults').style.display='none';$('appsList').style.display='';$('appSearch').value='';
  toast('已添加：'+name);
}
function decodeEntities(s){return String(s).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");}

/* modal */
function openAddApp(){$('modalTitle').textContent='添加应用';$('appName').value='';$('appPath').value='';showModal();}
function editApp(id){var a=apps.find(function(x){return x.id===id;});if(!a)return;$('modalTitle').textContent='编辑应用';$('appName').value=a.name;$('appPath').value=a.path;showModal();}
function showModal(){$('appModal').classList.add('show');setTimeout(function(){$('appName').focus();},60);}
function closeModal(){$('appModal').classList.remove('show');}
function saveApp(){
  var n=$('appName').value.trim(),p=$('appPath').value.trim();
  if(!n||!p){toast('请填写名称和路径');return;}
  apps.push({id:uid(),name:n,path:p});renderApps();closeModal();toast('已添加：'+n);
}
function delApp(id){apps=apps.filter(function(a){return a.id!==id;});renderApps();toast('已删除');}
function delPinned(id){pinned=pinned.filter(function(f){return f.id!==id;});renderFolders();toast('已移除');}

function launchAll(){toast('已发送：全部启动（'+apps.length+' 个应用）');}
function closeAll(){toast('已发送：全部关闭');}
function updatePill(){$('pillStat').textContent='应用 '+apps.length+' · 文件夹 '+(pinned.length+recent.length)+' · 文件 '+files.length;}

/* toast */
var tt;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},1900);}

/* theme */
function toggleTheme(){var r=document.documentElement;var d=r.getAttribute('data-theme')==='dark';r.setAttribute('data-theme',d?'light':'dark');toast(d?'已切换到亮色':'已切换到暗色');}

/* esc to close modal, keyboard a11y */
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

renderApps();renderFolders();renderFiles();
</script>
</body>
</html>
